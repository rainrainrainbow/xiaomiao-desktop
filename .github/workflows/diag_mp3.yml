name: Diagnose minimp3 on host

on:
  push:
    paths:
      - '.github/workflows/diag_mp3.yml'
      - 'assets/renshijian.mp3'
  workflow_dispatch:

jobs:
  host-mp3-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run minimp3 host test
        run: |
          cat > /tmp/mp3test.c <<'EOF'
#include <stdio.h>
#include <stdlib.h>
#include <string.h>
#define MINIMP3_IMPLEMENTATION
#define MINIMP3_ONLY_MP3
#include "main/driver/minimp3.h"
int main(void) {
    FILE *f = fopen("assets/renshijian.mp3","rb");
    if (!f) { printf("OPEN FAIL\n"); return 1; }
    fseek(f,0,SEEK_END); long sz=ftell(f); rewind(f);
    unsigned char *buf = malloc(sz);
    if (fread(buf,1,sz,f)!=(size_t)sz) { printf("READ FAIL\n"); return 1; }
    fclose(f);
    printf("file size %ld first4 %02x%02x%02x%02x\n", sz, buf[0],buf[1],buf[2],buf[3]);
    mp3dec_t dec; mp3dec_init(&dec);
    mp3dec_frame_info_t info;
    short pcm[MINIMP3_MAX_SAMPLES_PER_FRAME];
    long off=0;
    for (int frame=0; frame<12; frame++) {
        memset(pcm,0,sizeof(pcm));
        int samples = mp3dec_decode_frame(&dec, buf+off, (int)(sz-off), pcm, &info);
        int peak=0;
        for (int i=0;i<samples*info.channels && i<MINIMP3_MAX_SAMPLES_PER_FRAME;i++){
            int a=pcm[i]<0?-pcm[i]:pcm[i]; if(a>peak)peak=a;
        }
        printf("frame %d samples=%d hz=%d ch=%d frame_bytes=%d peak=%d first=%d,%d,%d\n",
               frame, samples, info.hz, info.channels, info.frame_bytes, peak,
               pcm[0],pcm[1],pcm[2]);
        if (info.frame_bytes>0) off+=info.frame_bytes; else off+=1;
        if (off>=sz) break;
    }
    return 0;
}
EOF
          gcc -O2 -o /tmp/mp3test /tmp/mp3test.c -lm
          /tmp/mp3test
